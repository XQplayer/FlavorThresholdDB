name: Deploy Render API

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: API version expected from /health after deployment
        required: true
        default: 1.5.0

permissions:
  contents: read

concurrency:
  group: render-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require protected deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: test -n "$RENDER_DEPLOY_HOOK_URL"

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for the expected API version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          API_BASE_URL: ${{ vars.FEMA_API_URL }}
        run: |
          node <<'NODE'
          const expected = process.env.EXPECTED_VERSION;
          const url = `${process.env.API_BASE_URL.replace(/\/$/, '')}/health`;
          for (let attempt = 1; attempt <= 40; attempt += 1) {
            try {
              const response = await fetch(url, { cache: 'no-store' });
              const body = await response.json();
              console.log(`attempt ${attempt}: ${response.status} version=${body.api_version || 'missing'} commit=${body.deploy_commit || 'missing'}`);
              if (response.ok && body.ok === true && body.api_version === expected) process.exit(0);
            } catch (error) {
              console.log(`attempt ${attempt}: ${error.message}`);
            }
            await new Promise(resolve => setTimeout(resolve, 15000));
          }
          console.error(`Render did not expose API version ${expected} within 10 minutes.`);
          process.exit(1);
          NODE

      - name: Verify public evidence endpoints
        env:
          API_BASE_URL: ${{ vars.FEMA_API_URL }}
        run: |
          base="${API_BASE_URL%/}"
          curl --fail --silent --show-error "$base/spectra/index-status" >/dev/null
          curl --fail --silent --show-error "$base/nist-webbook?cas=141-78-6" >/dev/null
          curl --fail --silent --show-error "$base/biochemistry/resolve?inchikey=XEKOWRVHYACXOJ-UHFFFAOYSA-N&cas=141-78-6&name=ethyl%20acetate" >/dev/null
          curl --fail --silent --show-error "$base/biological-context/resolve?inchikey=XEKOWRVHYACXOJ-UHFFFAOYSA-N&cas=141-78-6&name=ethyl%20acetate" >/dev/null
          curl --fail --silent --show-error "$base/bioactivity/resolve?cid=8857&inchikey=XEKOWRVHYACXOJ-UHFFFAOYSA-N&smiles=CCOC%28%3DO%29C" >/dev/null
          curl --fail --silent --show-error "$base/structures/resolve?inchikey=XEKOWRVHYACXOJ-UHFFFAOYSA-N&cas=141-78-6&name=ethyl%20acetate" >/dev/null
