services:
  - type: web
    name: flavorthresholddb-api
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python fema_proxy_server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: PUBLIC_SPECTRUM_INDEX_AUTO_INSTALL
        value: "false"
